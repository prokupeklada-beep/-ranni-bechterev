<style>
:root{--blue:#0c5f9f;--blue2:#137ab8;--pale:#eaf8ff;--ink:#12344d;--danger:#a82929}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(#eefaff,#fff);color:var(--ink)}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 12px calc(16px + env(safe-area-inset-bottom))}
header{text-align:center;padding:10px 4px 4px} h1{margin:0;color:#073a78;font-size:clamp(28px,7vw,44px);letter-spacing:.5px} .sub{color:#267fb3;font-weight:700;margin-top:3px}
.card{background:#fff;border:1px solid #cbeafa;border-radius:24px;box-shadow:0 8px 28px #0c5f9f18;overflow:hidden;margin-top:10px}
.top{display:flex;gap:10px;align-items:center;padding:12px} .num{width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,#1494c9,#0665a9);color:white;display:grid;place-items:center;font-size:32px;font-weight:900;flex:none}
h2{font-size:26px;line-height:1.05;margin:0;color:#073a78} .target{font-weight:800;color:#147eb5;margin-top:5px}
.figure{background:#eaf8ff;padding:8px} .figure img{width:100%;max-height:52vh;object-fit:contain;display:block;border-radius:16px;background:white}
.text{padding:14px} .inst{font-size:18px;line-height:1.4;font-weight:650} .safe{margin-top:10px;padding:10px 12px;border-radius:13px;background:#fff5e8;color:#794900;font-weight:750}
.timerWrap{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 10px 4px} .timer{font-variant-numeric:tabular-nums;font-size:56px;font-weight:900;color:#073a78;min-width:115px;text-align:center}
.progress{height:10px;background:#d9eef8;border-radius:99px;overflow:hidden;margin:0 14px 12px} .bar{height:100%;background:#147eb5;width:100%;transition:width .25s linear}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px} button{border:0;border-radius:15px;padding:13px 8px;font-size:16px;font-weight:850;background:#0d71ad;color:white;box-shadow:0 3px 9px #0d71ad33} button.secondary{background:#e6f4fb;color:#0a5c94} button.danger{background:#7e8a92} button:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 14px}
.voice{background:#e8f8ff;color:#075a91} .voice.playing{background:#075a91;color:white}
.status{text-align:center;font-size:14px;color:#5e7685;min-height:20px;padding-bottom:8px}
.wall{margin:12px 0 0;padding:14px;background:#eef9ff;border-radius:18px} .wall label{font-weight:800} .wall input{width:84px;font-size:20px;padding:8px;border:1px solid #a8d7ec;border-radius:10px;margin-left:8px}
.note{font-size:13px;line-height:1.4;color:#5a6870;padding:12px 8px 0} .finish{text-align:center;padding:30px 18px} .finish h2{font-size:34px}

let i=0, left=40, running=false, interval=null, audio=null;
const main=document.getElementById('main');
const wall=document.getElementById('wall');
wall.value=localStorage.getItem('rb31_wall')||'';
wall.oninput=()=>localStorage.setItem('rb31_wall',wall.value);

function stopAudio(){try{audio.pause();audio.currentTime=0;}catch(_){}}
function fmt(s){return '0:'+String(s).padStart(2,'0')}
function update(){
 const t=document.getElementById('timer'),b=document.getElementById('bar');
 if(t)t.textContent=fmt(left); if(b)b.style.width=(left/40*100)+'%';
}
function startTimer(){if(running)return;running=true;document.getElementById('pause').textContent='⏸ Pauza'; interval=setInterval(()=>{left--;update();if(left<=0){clearInterval(interval);running=false; if(i<E.length-1){i++;left=40;render();playVoice();startTimer();} else finish();}},1000)}
function toggle(){if(running){clearInterval(interval);running=false;document.getElementById('pause').textContent='▶️ Pokračovat';}else{if(left===40)playVoice();startTimer();}}
function playVoice(){
 const e=E[i]; const st=document.getElementById('status'); const vb=document.getElementById('voice');
 try{audio.pause();audio.currentTime=0;}catch(_){}
 audio.src=e.audio; audio.preload='auto'; vb.classList.add('playing'); st.textContent='Načítám hluboký mužský hlas…';
 audio.play().then(()=>{st.textContent='Přehrává se mužský hlas.'}).catch(()=>{st.textContent='Klepni jednou na „Mužský hlas“. Potom se další cviky budou spouštět automaticky.'});
 audio.onended=()=>{vb.classList.remove('playing');st.textContent=''};
 audio.onerror=()=>{vb.classList.remove('playing');st.textContent='Zvuk se nepodařilo načíst. Zkus znovu načíst stránku.'};
}
function next(){stopAudio();clearInterval(interval);running=false;if(i<E.length-1){i++;left=40;render();playVoice();}else finish();}
function prev(){stopAudio();clearInterval(interval);running=false;if(i>0){i--;left=40;render();}}
function repeatExercise(){stopAudio();clearInterval(interval);running=false;left=40;render();playVoice();startTimer();}
function finish(){stopAudio();clearInterval(interval);running=false;main.innerHTML=`<section class="card finish"><h2>Hotovo 👏</h2><p>Celá ranní sestava je dokončena.</p><button onclick="restart()">Začít znovu</button></section>`}
function restart(){i=0;left=40;running=false;render()}
render();
</script>
